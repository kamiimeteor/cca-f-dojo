/* ============ 自由刷题 ============ */
const SCOPE={scope:'all',size:10};
function poolFor(scope){
  if(scope==='all') return BANK.map((q,i)=>i);
  if(scope==='wrong') return DB.wrong.map(w=>w.qi);
  if(/^w[123]$/.test(scope)) return BANK.map((q,i)=>i).filter(i=>weekOf(BANK[i].d)===+scope.slice(1));
  if(scope.startsWith('p:')) return BANK.map((q,i)=>i).filter(i=>BANK[i].p===scope.slice(2));
  return [];
}
function scopeLabel(){
  const s=SCOPE.scope;
  if(s==='all') return '全部题库';
  if(s==='wrong') return '我的错题';
  if(/^w[123]$/.test(s)) return 'Week '+s.slice(1);
  return s.slice(2);
}
function renderPractice(){
  const pool=poolFor(SCOPE.scope);
  const take=Math.min(SCOPE.size||pool.length,pool.length);
  let h='<h1>自由刷题</h1>'
  +'<p class="sub">不计入每日记录，只用来临时补练。答错照样进错题集、答对照样把错题移出。</p>'
  +'<div class="card"><h3 style="margin-top:0">范围</h3><div class="chips" id="scopeChips">'
  +'<button class="chip'+(SCOPE.scope==='all'?' on':'')+'" data-s="all">全部题库<span class="n">'+BANK.length+'</span></button>'
  +[1,2,3].map(w=>'<button class="chip'+(SCOPE.scope==='w'+w?' on':'')+'" data-s="w'+w+'">Week '+w
     +'<span class="n">'+BANK.filter(q=>weekOf(q.d)===w).length+'</span></button>').join('')
  +'<button class="chip'+(SCOPE.scope==='wrong'?' on':'')+'" data-s="wrong">我的错题<span class="n">'+DB.wrong.length+'</span></button>'
  +'</div><h3>指定知识点</h3><select class="fld" id="pointSel"><option value="">— 不限（用上面的范围）—</option>'
  +POINTS.map(p=>'<option value="'+esc(p)+'"'+(SCOPE.scope==='p:'+p?' selected':'')+'>Day '+pad2(pointDay(p))+' · '
     +esc(p)+'（'+BANK.filter(q=>q.p===p).length+' 题）</option>').join('')
  +'</select><h3>题量</h3><div class="chips" id="sizeChips">'
  +[10,20,0].map(n=>'<button class="chip'+(SCOPE.size===n?' on':'')+'" data-n="'+n+'">'+(n||'全部')+'</button>').join('')
  +'</div><div class="row" style="margin-top:18px">'
  +'<button class="btn primary" id="startFree"'+(pool.length?'':' disabled')+'>开始（'+take+' 题）</button>'
  +'<span class="sub" style="margin:0">当前范围共 '+pool.length+' 题，随机抽取</span></div></div>';
  $('#app').innerHTML=h;
  $$('#scopeChips .chip').forEach(b=>b.onclick=()=>{ SCOPE.scope=b.dataset.s; renderPractice(); });
  $$('#sizeChips .chip').forEach(b=>b.onclick=()=>{ SCOPE.size=+b.dataset.n; renderPractice(); });
  $('#pointSel').onchange=e=>{ SCOPE.scope=e.target.value?('p:'+e.target.value):'all'; renderPractice(); };
  $('#startFree').onclick=()=>startFree(shuffle(pool).slice(0,SCOPE.size||pool.length),scopeLabel());
}

/* ============ 答题 ============ */
function startDay(d){
  const daily=dayIdx(d);
  const due=dueWrong().map(w=>w.qi).filter(i=>!daily.includes(i));
  RUN={kind:'day',day:d,label:'Day '+pad2(d)+' · '+MAT[d].t.split(' · ')[0],
       list:[...daily.map(qi=>({qi,re:false})),...due.map(qi=>({qi,re:true}))],
       i:0,res:[],answered:false,picks:[]};
}
function startFree(idxList,label){
  if(!idxList.length){ toast('这个范围里没有题'); return; }
  const wrongSet=new Set(DB.wrong.map(w=>w.qi));
  RUN={kind:'free',day:null,label:label,
       list:idxList.map(qi=>({qi,re:wrongSet.has(qi)})),
       i:0,res:[],answered:false,picks:[]};
  if(ROUTE==='#/practice/run') renderQuiz();
  else go('#/practice/run');
}

function renderQuiz(){
  if(!RUN){ go('#/'); return; }
  if(RUN.i>=RUN.list.length) return renderDone();
  const e=RUN.list[RUN.i], q=BANK[e.qi];
  const exit=RUN.kind==='day'?'#/':'#/practice';
  RUN.answered=false; RUN.picks=[];

  const mat=(RUN.kind==='day'&&RUN.i===0)?MAT[RUN.day]:null;
  const matCard=mat?'<div class="box key"><b class="bt">今日材料</b>'
    +'<p style="margin-bottom:6px">'+esc(mat.t)+'</p>'
    +mat.u.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="font-size:13px">'
       +esc(u.replace('https://',''))+'</a>').join('<br>')
    +'<p style="margin-top:8px;font-size:13px;color:var(--ink-3)">先 ①读 → ②敲 → ③复述，再回来做题。做题只是验收，不是学习本身。</p>'
    +'<div class="row" style="margin-top:10px"><a class="btn sm" href="#/notes/'+RUN.day+'">先看本节笔记</a></div></div>':'';

  const zone = q.t==='fill'
    ? '<label class="fld-l" for="fillin">输入答案，回车提交</label>'
      +'<input class="fld mono" id="fillin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答案">'
    : '<div class="opts" id="opts">'+q.o.map((o,i)=>
        '<button class="opt" data-i="'+i+'"><span class="ltr">'+LTR[i]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div>';

  const hint = q.t==='fill' ? '<kbd>Enter</kbd> 提交'
    : '<kbd>1</kbd>–<kbd>'+q.o.length+'</kbd> 选择'+(q.t==='ms'?' · <kbd>Enter</kbd> 提交':'');

  $('#app').innerHTML='<div class="quiz">'
   +'<div class="qbar"><a class="btn sm ghost" href="'+exit+'">← 退出</a>'
   +'<strong style="font-size:14px">'+esc(RUN.label)+'</strong>'
   +'<span class="spacer"></span><span class="ct">'+(RUN.i+1)+' / '+RUN.list.length+'</span></div>'
   +'<div class="progress-strip">'+RUN.list.map((_,i)=>
      '<i class="'+(i<RUN.i?(RUN.res[i]?'ok':'no'):i===RUN.i?'cur':'')+'"></i>').join('')+'</div>'
   +matCard
   +'<div class="q-meta"><span class="tag w'+weekOf(q.d)+'">Day '+pad2(q.d)+'</span>'
   +'<span class="tag q">'+esc(q.p)+'</span><span class="tag q">'+TYPE[q.t]+'</span>'
   +(q.t==='ms'?'<span class="tag multi">多选</span>':'')
   +(e.re?'<span class="tag re">↻ 错题复现</span>':'')+'</div>'
   +'<p class="q-stem">'+esc(q.q)+'</p>'
   +(q.c?codeBlock(q.c):'')
   +'<div id="zone">'+zone+'</div>'
   +'<div class="row" id="acts" style="margin-top:16px">'
   +((q.t==='fill'||q.t==='ms')?'<button class="btn primary" id="submit">'+(q.t==='fill'?'检查':'提交')+'</button>':'')
   +'<button class="btn ghost" id="idk">不会，看答案</button>'
   +'<span class="spacer"></span><span class="kbd-hint">'+hint+' · <kbd>Esc</kbd> 退出</span></div>'
   +'<div id="verdict"></div></div>';

  if(q.t==='fill'){
    const inp=$('#fillin');
    inp.focus();
    inp.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); $('#submit').click(); } };
    $('#submit').onclick=()=>{ if(RUN.answered)return; const v=inp.value; if(v.trim()) grade(v); else inp.focus(); };
  }else if(q.t==='ms'){
    $$('.opt').forEach(b=>b.onclick=()=>{ if(!RUN.answered) toggleMs(+b.dataset.i); });
    $('#submit').onclick=()=>{
      if(RUN.answered)return;
      if(RUN.picks.length) grade([...RUN.picks].sort((a,b)=>a-b));
      else toast('先选至少一项');
    };
  }else{
    $$('.opt').forEach(b=>b.onclick=()=>{ if(!RUN.answered) grade(+b.dataset.i); });
  }
  $('#idk').onclick=()=>{ if(!RUN.answered) grade(null,true); };
}
function toggleMs(i){
  const set=new Set(RUN.picks);
  set.has(i)?set.delete(i):set.add(i);
  RUN.picks=[...set];
  $$('.opt').forEach(b=>b.classList.toggle('sel',RUN.picks.includes(+b.dataset.i)));
}

async function grade(input,idk){
  const e=RUN.list[RUN.i], q=BANK[e.qi];
  let ok=false, ua='（不会）';
  if(idk){ ok=false; }
  else if(q.t==='fill'){ ua=input; ok=q.a.some(x=>norm(x)===norm(ua)); }
  else if(q.t==='ms'){
    const as=new Set(q.a), ss=new Set(input);
    ua=input.map(i=>q.o[i]).join('、');
    ok=as.size===ss.size&&[...as].every(i=>ss.has(i));
  }else{ ua=q.o[input]; ok=input===q.a; }

  RUN.answered=true;
  RUN.res[RUN.i]=ok;

  if(q.t==='fill'){
    $('#fillin').disabled=true;
  }else{
    const as=new Set([].concat(q.a));
    const ss=new Set(idk?[]:[].concat(input));
    $$('.opt').forEach(b=>{
      const i=+b.dataset.i;
      b.disabled=true; b.classList.remove('sel');
      if(as.has(i)) b.classList.add('right');
      else if(ss.has(i)) b.classList.add('wrong');
    });
  }

  if(ok){
    removeWrong(e.qi);
  }else{
    DB.points[q.p]=(DB.points[q.p]||0)+1;
    const ex=DB.wrong.find(w=>w.qi===e.qi);
    if(ex){ ex.due=Date.now()+DAY_MS; ex.ua=String(ua).slice(0,300); ex.ts=Date.now(); }
    else DB.wrong.push({qi:e.qi,ua:String(ua).slice(0,300),ts:Date.now(),due:Date.now()+DAY_MS});
  }
  updateWrongPill();
  $$('.progress-strip i')[RUN.i].className=ok?'ok':'no';
  $('#acts').remove();

  const last=RUN.i+1>=RUN.list.length;
  const head=ok?'✓ 答对了':idk?'ℹ 已标记「不会」 — 这个知识点计入预警':'✗ 答错了';
  const yours=(idk||q.t==='fill')?'<br>你的作答：'+esc(String(ua)):'';
  const ansLine=ok?'':'<p class="ans">正确答案：<b>'+esc(String(answerText(q)))+'</b>'
    +(q.t==='fill'?'':'（'+answerLetters(q)+'）')+yours+'</p>';

  $('#verdict').innerHTML='<div class="verdict '+(ok?'good':'bad')+'">'
   +'<div class="vh">'+head+(ok?'':'<span class="tag q">Day '+q.d+' · '+esc(q.p)+'</span>')+'</div>'
   +ansLine+'<p>'+esc(q.e)+'</p>'
   +'<div class="row"><button class="btn sm primary" id="next">'+(last?'看结果':'下一题')+'</button>'
   +'<a class="btn sm ghost" href="#/notes/'+q.d+'" target="_blank" rel="noopener">回看 Day '+q.d+' 笔记 ↗</a>'
   +'</div></div>';
  $('#next').onclick=nextQ;
  $('#next').focus();
  await save();
}
function nextQ(){ RUN.i++; renderQuiz(); }
function removeWrong(qi){
  const i=DB.wrong.findIndex(w=>w.qi===qi);
  if(i>=0) DB.wrong.splice(i,1);
}

function renderDone(){
  const total=RUN.list.length;
  const score=RUN.res.filter(Boolean).length;
  // 每日记录只统计当天本身的 10 题：混进来的错题复现不该改变当天满分的分母
  if(RUN.kind==='day'&&!RUN.saved){
    RUN.saved=true;
    const own=RUN.list.map((e,i)=>({e,i})).filter(x=>!x.e.re);
    DB.days[RUN.day]={score:own.filter(x=>RUN.res[x.i]).length,total:own.length,ts:Date.now()};
    save();
  }
  const rate=pct(score,total);
  const full=score===total;
  const missed=RUN.list.filter((e,i)=>!RUN.res[i]).map(e=>e.qi);
  const msg=full?'全对。明天见。'
    :rate>=60?'过关。错的已进错题集，明天日测自动复现（↻）。'
    :'低于 60%，建议回材料重读一遍再做一次。';

  $('#app').innerHTML='<div class="quiz"><div class="card score-hero">'
   +'<div class="lbl">'+esc(RUN.label)+'</div>'
   +'<div class="big '+(full?'pass':rate>=60?'':'fail')+'">'+score+' / '+total+'</div>'
   +'<div class="msg">'+msg+'</div>'
   +'<div class="row" style="justify-content:center;margin-top:18px">'
   +(missed.length?'<button class="btn primary" id="redoWrong">立即重练本轮错题（'+missed.length+'）</button>':'')
   +'<a class="btn'+(missed.length?'':' primary')+'" href="'+(RUN.kind==='day'?'#/':'#/practice')+'">'
   +(RUN.kind==='day'?'返回总览':'再来一组')+'</a>'
   +'<a class="btn ghost" href="#/wrong">看错题集</a></div></div>'
   +(RUN.kind==='day'&&RUN.day<21?'<div class="row" style="justify-content:center;margin-top:14px">'
     +'<a class="btn sm ghost" href="#/day/'+(RUN.day+1)+'">继续 Day '+pad2(RUN.day+1)+' →</a></div>':'')
   +'</div>';
  updateWrongPill();
  const rw=$('#redoWrong');
  if(rw) rw.onclick=()=>startFree(missed,'本轮错题重练');
}

/* ============ 错题集 ============ */
let wrongFilter='';
function renderWrong(){
  const due=dueWrong().length;
  let h='<h1>错题集</h1>'
  +'<p class="sub">答错自动进来，<b>1 天后混入你的下一次日测</b>（带 ↻ 标记）；练对即移出，再错就再顺延一天。</p>';

  if(!DB.wrong.length){
    h+='<div class="empty"><div class="em">◆</div>错题集是空的。<br>要么你太强，要么你还没开始。'
      +'<div class="row" style="justify-content:center;margin-top:18px">'
      +'<a class="btn primary" href="#/">回总览开始 Day 01</a></div></div>';
    $('#app').innerHTML=h;
    return;
  }

  const groups={};
  DB.wrong.forEach(w=>{ const p=BANK[w.qi].p; (groups[p]=groups[p]||[]).push(w); });
  const keys=Object.keys(groups).sort((a,b)=>pointDay(a)-pointDay(b));
  if(wrongFilter&&!groups[wrongFilter]) wrongFilter='';

  h+='<div class="row" style="margin-bottom:16px">'
   +'<button class="btn primary" id="retryAll">全部重练（'+DB.wrong.length+'）</button>'
   +(due?'<button class="btn" id="retryDue">只练到期（'+due+'）</button>':'')
   +'<span class="spacer"></span><button class="link-btn danger" id="clear">清空错题集</button></div>'
   +'<div class="chips" style="margin-bottom:18px">'
   +'<button class="chip'+(wrongFilter?'':' on')+'" data-f="">全部<span class="n">'+DB.wrong.length+'</span></button>'
   +keys.map(p=>'<button class="chip'+(wrongFilter===p?' on':'')+'" data-f="'+esc(p)+'">'+esc(p)
      +'<span class="n">'+groups[p].length+'</span></button>').join('')
   +'</div>';

  keys.filter(p=>!wrongFilter||p===wrongFilter).forEach(p=>{
    const n=DB.points[p]||0;
    h+='<h2 style="margin-top:26px">'+esc(p)+' <span class="tag q">'+groups[p].length+' 题</span>'
      +(n>=2?' <span class="tag" style="background:var(--bad)">累计 '+n+' 错 → 回 Day '+pointDay(p)+'</span>':'')+'</h2>';
    groups[p].forEach(w=>{
      const q=BANK[w.qi];
      const overdue=w.due<=Date.now();
      h+='<div class="item"><div class="ih">'
        +'<span class="tag w'+weekOf(q.d)+'">Day '+pad2(q.d)+'</span>'
        +'<span class="tag q">'+TYPE[q.t]+'</span>'
        +(overdue?'<span class="tag" style="background:var(--warn)">已到期 · 下次日测复现</span>'
          :'<span>'+Math.max(1,Math.ceil((w.due-Date.now())/36e5))+' 小时后到期</span>')
        +'</div><div class="iq">'+esc(q.q)+'</div>'
        +(q.c?codeBlock(q.c):'')
        +'<div class="ia">你的答案：<span class="ua">'+esc(w.ua)+'</span><br>'
        +'正确答案：<span class="ca">'+esc(String(answerText(q)))+'</span></div>'
        +'<div class="ie">'+esc(q.e)+'</div></div>';
    });
  });

  $('#app').innerHTML=h;
  $$('[data-f]').forEach(b=>b.onclick=()=>{ wrongFilter=b.dataset.f; renderWrong(); });
  $('#retryAll').onclick=()=>startFree(shuffle(DB.wrong.map(w=>w.qi)),'错题重练');
  const rd=$('#retryDue'); if(rd) rd.onclick=()=>startFree(dueWrong().map(w=>w.qi),'到期错题');
  $('#clear').onclick=async()=>{
    if(!confirm('清空全部错题？知识点的累计错误次数会保留。')) return;
    DB.wrong=[]; await save(); updateWrongPill(); renderWrong();
    toast('错题集已清空','good');
  };
}

/* ============ 进度管理 ============ */
let PENDING=null;
function digest(db){
  const rows=Object.values(db&&db.days||{}).filter(r=>r&&+r.total>0);
  return {days:rows.length,
          total:rows.reduce((s,r)=>s+(+r.total||0),0),
          score:rows.reduce((s,r)=>s+(+r.score||0),0),
          wrong:(db&&Array.isArray(db.wrong)?db.wrong:[]).length};
}
function openProgress(){ $('#progModal').hidden=false; renderProgressBody(); }
function renderProgressBody(){
  const d=digest(DB);
  $('#progBody').innerHTML=
   '<p class="sub" style="margin-top:0">进度只存在这台设备的浏览器里。换设备、清缓存前先导出一份 JSON。</p>'
  +'<h3>当前进度</h3><div class="chips">'
  +'<span class="chip static">完成 '+d.days+' / 21 天</span>'
  +'<span class="chip static">答对 '+d.score+' / '+d.total+'</span>'
  +'<span class="chip static">正确率 '+pct(d.score,d.total)+'%</span>'
  +'<span class="chip static">错题 '+d.wrong+'</span></div>'
  +'<h3>导出</h3><div class="row">'
  +'<button class="btn sm" id="expDl">下载 JSON</button>'
  +'<button class="btn sm" id="expCopy">复制到剪贴板</button></div>'
  +'<h3>导入</h3><div class="dropzone" id="dz">'
  +'<div class="dz-main">把 JSON 文件拖到这里，或 <button class="link-btn" id="pick">选择文件</button></div>'
  +'<div class="dz-sub">也可以直接粘贴内容到下面</div></div>'
  +'<textarea class="fld" id="pasteBox" rows="3" placeholder="粘贴导出的 JSON，然后点「解析」" style="margin-top:10px"></textarea>'
  +'<div class="row" style="margin-top:9px"><button class="btn sm" id="parseBtn">解析</button></div>'
  +'<div id="importPreview"></div>'
  +'<h3 style="margin-top:26px">危险操作</h3><div class="row">'
  +'<button class="btn sm" id="wipe">清空全部进度</button>'
  +'<span class="sub" style="margin:0">天数记录、错题、知识点计数全部归零</span></div>';

  $('#expDl').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const t=new Date();
    const stamp=t.getFullYear()+pad2(t.getMonth()+1)+pad2(t.getDate());
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='react-21d-progress-'+stamp+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('#expCopy').onclick=async ev=>{
    const ok=await copyText(JSON.stringify(DB));
    ok?flash(ev.currentTarget,'已复制'):toast('复制失败，请改用「下载 JSON」','bad');
  };
  $('#pick').onclick=()=>$('#importFile').click();
  $('#parseBtn').onclick=()=>stageImport($('#pasteBox').value);
  const dz=$('#dz');
  dz.ondragover=ev=>{ ev.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=ev=>{
    ev.preventDefault(); dz.classList.remove('over');
    const f=ev.dataTransfer.files[0];
    if(f) f.text().then(stageImport);
  };
  $('#wipe').onclick=async()=>{
    if(!confirm('清空全部进度？这一步不可撤销，建议先导出备份。')) return;
    const theme=DB.prefs.theme;
    DB={days:{},wrong:[],points:{},prefs:{theme:theme,lastNote:0}};
    RUN=null;
    await save(); updateWrongPill(); renderProgressBody(); router();
    toast('进度已清空','good');
  };
}
function stageImport(text){
  let obj=null;
  try{ obj=JSON.parse(text); }catch(e){}
  if(!obj||typeof obj!=='object'||(!obj.days&&!obj.wrong)){
    $('#importPreview').innerHTML='<div class="box warn" style="margin-top:12px"><p>解析失败：这不是本站导出的进度文件。</p></div>';
    return;
  }
  PENDING=obj;
  const a=digest(DB), b=digest(obj);
  $('#importPreview').innerHTML='<div class="box key" style="margin-top:12px"><b class="bt">导入预览</b>'
   +'<p style="font-size:13.5px">当前：'+a.days+' 天 · '+a.score+'/'+a.total+' 题 · '+a.wrong+' 错题<br>'
   +'文件：'+b.days+' 天 · '+b.score+'/'+b.total+' 题 · '+b.wrong+' 错题</p>'
   +'<div class="row" style="margin-top:10px">'
   +'<button class="btn sm primary" id="doMerge">合并（每天取更高分）</button>'
   +'<button class="btn sm" id="doReplace">整体替换</button></div></div>';
  $('#doMerge').onclick=()=>applyImport('merge');
  $('#doReplace').onclick=()=>applyImport('replace');
}
async function applyImport(mode){
  if(!PENDING) return;
  const theme=DB.prefs.theme;
  if(mode==='replace'){
    if(!confirm('整体替换当前进度？当前数据会被覆盖。')) return;
    DB={days:PENDING.days||{},wrong:PENDING.wrong||[],points:PENDING.points||{},
        prefs:{theme:theme,lastNote:(PENDING.prefs||{}).lastNote}};
  }else{
    const out={days:Object.assign({},DB.days),wrong:[...DB.wrong],
               points:Object.assign({},DB.points),prefs:{theme:theme,lastNote:DB.prefs.lastNote}};
    Object.entries(PENDING.days||{}).forEach(([d,r])=>{
      if(!r||!(+r.total>0)) return;
      const cur=out.days[d];
      if(!cur||!(+cur.total>0)||(+r.score/+r.total)>(cur.score/cur.total)) out.days[d]=r;
    });
    (PENDING.wrong||[]).forEach(w=>{
      if(!w||!BANK[w.qi]) return;
      const ex=out.wrong.find(x=>x.qi===w.qi);
      if(ex) ex.due=Math.min(ex.due,+w.due||ex.due);
      else out.wrong.push(w);
    });
    Object.entries(PENDING.points||{}).forEach(([p,n])=>{
      out.points[p]=Math.max(out.points[p]||0,Math.floor(+n||0));
    });
    DB=out;
  }
  sanitizeDB();
  PENDING=null; RUN=null;
  await save();
  updateWrongPill(); renderProgressBody(); router();
  toast(mode==='replace'?'已替换为导入的进度':'已合并导入的进度','good');
}

$('#progBtn').onclick=openProgress;
$('#progClose').onclick=()=>{ $('#progModal').hidden=true; };
$('#progModal').onclick=ev=>{ if(ev.target.id==='progModal') $('#progModal').hidden=true; };
$('#importFile').onchange=ev=>{
  const f=ev.target.files[0];
  if(f) f.text().then(stageImport);
  ev.target.value='';
};

/* ============ 键盘 ============ */
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(!$('#progModal').hidden){ $('#progModal').hidden=true; return; }
    if(RUN&&$('.quiz')) go(RUN.kind==='day'?'#/':'#/practice');
    return;
  }
  if(!RUN||!$('.quiz')) return;
  if(ev.metaKey||ev.ctrlKey||ev.altKey) return;
  const inInput=ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA';

  if(RUN.answered){
    if((ev.key==='Enter'||ev.key===' ')&&!inInput){ ev.preventDefault(); nextQ(); }
    return;
  }
  if(RUN.i>=RUN.list.length) return;
  const q=BANK[RUN.list[RUN.i].qi];
  if(inInput) return;                       // 填空题的 Enter 由输入框自己处理
  if(ev.key==='Enter'&&q.t==='ms'){ ev.preventDefault(); $('#submit').click(); return; }
  if(q.t==='fill') return;
  let idx=-1;
  if(/^[1-9]$/.test(ev.key)) idx=+ev.key-1;
  else if(/^[a-h]$/i.test(ev.key)) idx=LTR.indexOf(ev.key.toUpperCase());
  if(idx<0||idx>=q.o.length) return;
  ev.preventDefault();
  if(q.t==='ms') toggleMs(idx); else grade(idx);
});

/* ============ 启动 ============ */
(async()=>{
  await load();
  applyTheme();
  trackTopbarHeight();
  updateWrongPill();
  router();
})();
</script>
</body>
