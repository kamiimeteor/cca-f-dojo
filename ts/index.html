<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeScript 21天 · 每日测试</title>
<script src="../shared/chrome.js" data-app="ts"></script>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E◆%3C/text%3E%3C/svg%3E">
<style>
  /* Legacy names remain aliases; --warn and --ok come directly from the shared layer. */
  :root{
    --bg:var(--paper); --panel:var(--paper-2); --panel2:var(--paper-3); --border:var(--line);
    --text:var(--ink); --dim:var(--ink-2); --faint:var(--ink-3); --err:var(--bad);
    --day-done:#356319; /* Completed: distinct from perfect and warning text. */
  }
  [data-theme="dark"]{--day-done:#9ECE6A}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7;min-height:100vh}
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit;background:none;border:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}

  /* header */
  .wrap > header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 20px;flex-wrap:wrap}
  .logo{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.02em}
  .logo .kw{color:var(--code-kw)} .logo .str{color:var(--code-str)}
  .statline{font-family:var(--sans);font-size:12px;color:var(--dim)}
  .statline b{color:var(--ok);font-weight:600}

  /* union day picker */
  .union{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 18px 14px;margin-bottom:16px}
  .union .decl{font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:12px}
  .union .decl .kw{color:var(--code-kw)}
  .weekband{font-family:var(--sans);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
  .weekband:first-of-type{margin-top:0}
  .days{display:flex;flex-wrap:wrap;gap:8px}
  .day{font-family:var(--sans);min-width:52px;padding:8px 6px;border:1px solid var(--border);border-radius:8px;
       background:var(--bg);text-align:center;transition:border-color .15s,transform .1s;position:relative}
  .day:hover{border-color:var(--accent);transform:translateY(-1px)}
  .day .n{font-size:15px;font-weight:600;color:var(--accent-strong)}
  .day .pipe{color:var(--faint);font-weight:400}
  .day .sc{display:block;font-size:10px;margin-top:2px;color:var(--faint)}
  .day.done .sc{color:var(--day-done)}
  .day.done{border-color:color-mix(in srgb, var(--day-done) 40%, transparent)}
  .day.perfect .sc{color:var(--ok)}
  .day.hasWrong .sc{color:var(--warn)}

  /* wrong book entry */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:13px;padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);transition:border-color .15s}
  .btn:hover{border-color:var(--accent)}
  .btn.warn{border-color:color-mix(in srgb, var(--bad) 35%, transparent)} .btn.warn:hover{border-color:var(--err)}
  .btn.primary{background:var(--accent-strong);color:var(--on-accent);font-weight:600;border-color:var(--accent-strong)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  /* editor card (question) */
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
  .qhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2);font-family:var(--sans);font-size:12px;color:var(--dim)}
  .dots{display:flex;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);opacity:.55}
  .qhead .fname{margin-left:4px}
  .qhead .prog{margin-left:auto;color:var(--dim)}
  .qbody{padding:18px 18px 20px}
  .ptag{display:inline-block;font-family:var(--sans);font-size:11px;color:var(--warn);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);border-radius:99px;padding:1px 10px;margin-bottom:12px}
  .qtext{font-size:15px;margin-bottom:14px}
  .qtext code{font-family:var(--mono);background:var(--code-bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;color:var(--code-str)}

  /* code block with line numbers */
  .code{font-family:var(--mono);font-size:13px;line-height:1.75;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px 0;margin-bottom:16px;overflow-x:auto}
  .cl{display:flex;white-space:pre}
  .ln{width:38px;flex:none;text-align:right;padding-right:14px;color:var(--faint);user-select:none}
  .cl .c{padding-right:16px}
  .tk{color:var(--code-kw)} .ts{color:var(--code-str)} .tc{color:var(--code-com);font-style:italic} .tt{color:var(--code-type)}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{text-align:left;font-size:14px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--code-bg);display:flex;gap:10px;align-items:flex-start;transition:border-color .12s}
  .opt:hover{border-color:var(--accent)}
  .opt .key{font-family:var(--sans);color:var(--accent-strong);flex:none;font-size:13px;padding-top:1px}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrongpick{border-color:var(--err);background:var(--bad-bg)}
  .opt.lock{cursor:default}
  .opt.lock:hover{border-color:var(--border)}
  .opt.lock.right:hover{border-color:var(--ok)} .opt.lock.wrongpick:hover{border-color:var(--err)}

  .fillrow{display:flex;gap:10px;flex-wrap:wrap}
  .fill{flex:1;min-width:200px;font-family:var(--mono);font-size:14px;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text)}
  .fill::placeholder{color:var(--faint)}

  /* tsc output */
  .tsc{font-family:var(--sans);font-size:13px;border-radius:8px;padding:13px 16px;margin-top:16px;border:1px solid;line-height:1.8}
  .tsc.ok{border-color:color-mix(in srgb, var(--ok) 40%, transparent);background:var(--ok-bg);color:var(--ok)}
  .tsc.bad{border-color:color-mix(in srgb, var(--bad) 40%, transparent);background:var(--bad-bg)}
  .tsc.bad .ehead{color:var(--err)}
  .tsc .exp{color:var(--text);font-family:var(--sans);font-size:14px;margin-top:6px}
  .tsc .ans{color:var(--ok)}

  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
  .hint{font-family:var(--sans);font-size:12px;color:var(--faint)}

  /* result */
  .result{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px 22px;text-align:center}
  .result .big{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:-.02em}
  .result .big .sep{color:var(--faint)} 
  .result .verdict{font-family:var(--sans);font-size:13px;margin:8px 0 18px}
  .result .verdict.ok{color:var(--ok)} .result .verdict.bad{color:var(--warn)}

  /* wrong book */
  .group h3{font-family:var(--sans);font-size:13px;color:var(--warn);margin:22px 0 10px;font-weight:600}
  .witem{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px;font-size:14px}
  .witem .wq{margin-bottom:8px}
  .witem .meta{font-family:var(--sans);font-size:12px;line-height:2}
  .witem .meta .lbl{color:var(--faint)}
  .witem .ua{color:var(--err)} .witem .ca{color:var(--ok)}
  .witem .we{color:var(--dim);font-size:13px;margin-top:6px;border-top:1px dashed var(--border);padding-top:8px}
  .witem .dtag{font-family:var(--sans);font-size:11px;color:var(--faint)}
  .empty{color:var(--dim);font-family:var(--sans);text-align:center;padding:50px 0;font-size:13px}
  .alertbox{border:1px solid;border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px;font-family:var(--sans);line-height:1.9}
  .alertbox.due{border-color:color-mix(in srgb, var(--ok) 40%, transparent);color:var(--ok);background:var(--ok-bg)}
  .alertbox.hot{border-color:color-mix(in srgb, var(--bad) 45%, transparent);background:var(--bad-bg);color:var(--text)}
  .alertbox.hot b{color:var(--err)}
  .hotp{display:inline-block;margin:4px 8px 0 0;color:var(--err);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);border-radius:99px;padding:1px 10px;font-size:12px}
  .ptag.rev{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 35%, transparent);margin-left:6px}
  .group h3.hoth{color:var(--err)}
  .matline{border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:13px;background:var(--panel);line-height:1.9}
  .matline .steps{font-family:var(--sans);font-size:11px;color:var(--dim)}
  .hubrow{display:flex;gap:12px;flex-wrap:wrap}
  .hubcard{flex:1;min-width:240px;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
  .hubcard:hover{border-color:var(--accent)}
  .hubcard.mute{opacity:.6;cursor:default}
  .hubcard.mute:hover{border-color:var(--border)}
  .hubcard .hn{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--accent-strong)}
  .hubcard .hs{font-family:var(--sans);font-size:13px;color:var(--dim)}
  .hubcard .hs.ok{color:var(--ok)} .hubcard .hs.warn{color:var(--warn)}
  .hubcard .hd{font-size:12px;color:var(--dim)}
  .editor{width:100%;min-height:180px;font-family:var(--mono);font-size:13px;line-height:1.75;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);resize:vertical;tab-size:2}
  .editor:focus-visible{outline:2px solid var(--accent);outline-offset:0}
  .backrow{margin-bottom:16px}
  .crumb{font-family:var(--sans);font-size:13px;color:var(--dim)}
  .crumb:hover{color:var(--accent-strong)}
  h2.vt{font-family:var(--mono);font-size:16px;margin-bottom:14px}
  h2.vt .kw{color:var(--code-kw)} h2.vt .str{color:var(--code-str)}
  .subnote{font-size:13px;color:var(--dim);margin-bottom:16px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:480px){ .day{min-width:46px} .wrap{padding:14px 12px 60px} }
  /* Small status text needs slightly stronger ink on the light status surfaces. */
  [data-theme="light"] :is(.statline b,.day.perfect .sc,.tsc.ok,.tsc .ans,.witem .ca,.alertbox.due,.ptag.rev,.hubcard .hs.ok,.result .verdict.ok){color:color-mix(in srgb, var(--ok) 88%, var(--ink))}
  .topbar{justify-content:space-between}
  .topbar .brand{min-width:0}
  .topbar .brand-text b{font-size:14px}
  @media(max-width:480px){.topbar{gap:8px;padding:0 12px}.brand-text em{letter-spacing:0}.topbar-tools{gap:6px}}
</style>
</head>
<body>
<!-- B 轮：共享顶栏替换 TEMP 返回链接；原测验 header 保留为页面内容。 -->
<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="brand-mark">◆</span>
    <span class="brand-text"><b>TypeScript 测验</b><em>21 天 · 每日测试</em></span>
  </a>
  <div class="topbar-tools">
    <div class="appswitch-wrap">
      <button class="appswitch-btn" id="appswitchBtn" type="button" aria-expanded="false" aria-controls="appswitchMenu">应用<span class="chev" aria-hidden="true">▾</span></button>
      <div class="appswitch-menu" id="appswitchMenu" hidden>
        <a class="appswitch-opt" href="/">signal0 首页</a>
        <a class="appswitch-opt" href="/cca-f/">CCA-F 备考站</a>
        <a class="appswitch-opt on" href="/ts/" aria-current="page">TypeScript 测验</a>
        <a class="appswitch-opt" href="/react/">React 测验</a>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button>
  </div>
</header>
<div class="wrap">
  <header>
    <div class="logo"><span class="kw">type</span> Quiz = <span class="str">"TS · 21天冲刺"</span></div>
    <div class="statline" id="topstat"></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ============ 题库 ============
   t: mc=选择 tf=对错 fill=填空
   a: mc/tf=正确选项下标, fill=可接受答案数组
   p: 知识点  e: 解析  c: 代码行数组(可选) */
const BANK = [
// ---------- Day 1 类型是契约 ----------
{d:1,t:'mc',p:'类型是契约',q:'对 TypeScript 类型标注最准确的理解是？',o:['给人看的注释，方便阅读','编译期强制执行的契约，违反就报错','运行时的数据校验','一种性能优化手段'],a:1,e:'类型不是"意思"，是"约束"。编译器不理解语义，只检查契约是否被遵守。'},
{d:1,t:'tf',p:'类型擦除',q:'TS 的类型检查发生在编译期；编译成 JS 后，类型信息在运行时已不存在。',a:0,e:'这叫"类型擦除"。所以类型能拦住编译期错误，但不能在运行时替你校验数据。'},
{d:1,t:'mc',p:'字面量联合',c:["type Message = {","  role: 'user' | 'assistant'","}"],q:'如果给 <code>role</code> 赋值 <code>\'system\'</code>，会发生什么？',o:['运行时抛出异常','编译器直接报错，代码无法通过','自动把 system 加入联合','role 退化为 any'],a:1,e:'契约里只允许两个值，第三个值直接被编译器拒绝——与"系统权限"等语义毫无关系。'},
{d:1,t:'fill',p:'类型推断',c:["let x = 5","x = 'hi'  // ❌ 报错"],q:'第二行报错，因为 <code>x</code> 在声明时已被自动推断为 ______ 类型。',a:['number','数字'],e:'没写类型标注时，TS 会根据初始值推断。这就是"悬停查看类型"能看到信息的原因。'},

// ---------- Day 2 基础类型 ----------
{d:2,t:'mc',p:'any 是失败信号',q:'哪个类型意味着"放弃类型检查"，在代码审查中应视为警报？',o:['unknown','void','any','undefined'],a:2,e:'any 关掉一切检查。AI 生成代码里出现 any，通常是它"没想清楚"的信号。'},
{d:2,t:'fill',p:'数组类型',q:'字符串数组可以写成 <code>string[]</code>，也可以写成 ______<code>&lt;string&gt;</code>。',a:['array'],e:'Array<string> 与 string[] 完全等价，后者更常用。'},
{d:2,t:'tf',p:'基础类型',c:["const n: number = '42'"],q:'这行代码能通过编译。',a:1,e:'不能。\'42\' 是字符串，契约要求 number。TS 不会帮你自动转换。'},
{d:2,t:'mc',p:'基础类型',q:'<code>boolean[]</code> 表示什么？',o:['一个布尔值','布尔值组成的数组','可能是布尔或数组','布尔类型的别名'],a:1,e:'[] 修饰的是"数组的元素类型"。'},

// ---------- Day 3 对象 + 可选 ----------
{d:3,t:'mc',p:'可选字段 ?',c:["type Message = {","  content: string","  toolCalls?: ToolCall[]","}"],q:'<code>toolCalls</code> 后面的 <code>?</code> 表示什么？',o:['这个字段已废弃','这个字段是可选的，可以不存在','这个字段可以是任意类型','这是一个疑问标记注释'],a:1,e:'用设计语言说：content 是必填字段，toolCalls 是选填字段。'},
{d:3,t:'tf',p:'可选字段 ?',q:'可选字段 <code>x?: string</code> 的实际类型等价于 <code>string | undefined</code>。',a:0,e:'所以读取可选字段前往往要先判空——这会引出第 6 天的"类型收窄"。'},
{d:3,t:'fill',p:'type vs interface',q:'按本计划的约定，定义对象类型先统一用 ______ 关键字（暂不纠结 interface）。',a:['type'],e:'两者大部分场景可互换。先用 type 建立肌肉记忆，避免陷入无意义争论。'},
{d:3,t:'mc',p:'对象契约',q:'访问对象类型上没有声明过的属性，结果是？',o:['返回 undefined，不报错','编译器报错：属性不存在','自动创建该属性','变成 any'],a:1,e:'报错原文通常是 "Property \'x\' does not exist on type \'Y\'"。第 8 天会专门练读它。'},

// ---------- Day 4 Union ----------
{d:4,t:'mc',p:'union 是收窄',q:'联合类型 <code>\'a\' | \'b\'</code> 的本质是？',o:['支持更多可能性，更灵活','把取值收窄到列出的几种，其余全部禁止','运行时的枚举对象','两个类型的合并'],a:1,e:'union 读作"或"，但作用是收窄边界——这是第 1 轮测试里你答偏的核心概念。'},
{d:4,t:'fill',p:'字面量联合',q:'请求状态只能是 idle / loading / error / success 之一：<br><code>type Status = </code>______',a:["'idle' | 'loading' | 'error' | 'success'","'idle'|'loading'|'error'|'success'",'idle | loading | error | success','idle|loading|error|success'],e:'字面量联合是设计系统里表达"状态机"和"variants"的基本工具。'},
{d:4,t:'tf',p:'union 语义',q:'<code>string | number</code> 表示一个值同时既是 string 又是 number。',a:1,e:'错。| 是"或"（其一），"且"（合并）用 & —— 第 16 天会遇到。'},
{d:4,t:'mc',p:'union × 设计系统',q:'<code>\'sm\' | \'md\' | \'lg\'</code> 在设计系统语境下最接近什么概念？',o:['断点 breakpoints','组件的 size variants 枚举','字号 token','媒体查询'],a:1,e:'variant 的允许值写进类型，传错值直接编译报错——设计规范变成了强制执行的契约。'},

// ---------- Day 5 函数与返回值 ----------
{d:5,t:'mc',p:'诚实的返回类型',c:["function getLast(msgs: Message[]): Message {","  return msgs[msgs.length - 1]","}"],q:'这段代码能编译，但隐患是？',o:['性能太差','空数组时实际返回 undefined，返回类型在撒谎','msgs 可能是 null','缺少 async'],a:1,e:'调用方以为一定拿到 Message，运行时却可能收到 undefined 然后崩溃。这是 AI 生成代码的高频错误。'},
{d:5,t:'fill',p:'诚实的返回类型',q:'上题的修复：把返回类型改成 <code>Message | </code>______。',a:['undefined'],e:'类型诚实了，调用方就会被迫先判空——错误在编译期被拦截。'},
{d:5,t:'tf',p:'索引访问的盲区',q:'既然返回类型撒谎了，TS 一定会报错阻止上面那段代码编译。',a:1,e:'错——它恰恰能编译。默认配置下数组索引访问被认为总是返回元素类型，这正是需要人来审查的盲区。'},
{d:5,t:'mc',p:'void',q:'<code>(next: T) =&gt; void</code> 中的 <code>void</code> 表示？',o:['返回 null','不返回有意义的值','返回任意值','函数是异步的'],a:1,e:'setter、事件处理器大多是 void：只产生副作用，不产出返回值。'},

// ---------- Day 6 Narrowing ----------
{d:6,t:'mc',p:'类型收窄',c:["function f(m: Message | undefined) {","  if (m === undefined) return","  m.content  // ✅ 不报错","}"],q:'为什么第 3 行访问 <code>.content</code> 不报错？',o:['TS 忽略 if 之后的代码','if 分支排除了 undefined，m 被收窄为 Message','content 是可选属性','运气好'],a:1,e:'TS 会顺着控制流推理："能走到这里，说明 m 不可能是 undefined 了"。这叫 narrowing。'},
{d:6,t:'fill',p:'typeof 收窄',q:'判断运行时基础类型用 ______ 操作符，例如 <code>if (______ x === \'string\')</code>。',a:['typeof'],e:'typeof 收窄适用于 string/number/boolean 等基础类型的分流。'},

code:"const tags: number[] = ['ai', 'design']",
req:[/tags\s*:\s*string\[\]/],hint:'[] 前面写的是"元素"的类型。',
sol:"const tags: string[] = ['ai', 'design']",exp:'string[] = 字符串数组。也可写 Array<string>。'},
{d:2,id:'e22',title:'消灭 any',brief:'any 关闭了检查。给参数一个诚实的类型。',
code:"function double(n: any) {\n  return n * 2\n}\ndouble('oops')",
req:[/n\s*:\s*number/],ban:[/any/],hint:'能做乘法的是什么类型？改完后最后一行会报错——把它也修好或删掉。',
sol:"function double(n: number) {\n  return n * 2\n}\ndouble(2)",exp:'去掉 any 后，编译器立刻抓住了 double(\'oops\') 这个隐患——这就是 any 的代价。'},
{d:3,id:'e31',title:'补上可选字段',brief:'Card 想支持副标题但不强制。扩展类型定义。',
code:"type Card = { title: string }\nconst c: Card = { title: 'BIFM', subtitle: 'agent booking' }",
req:[/subtitle\?\s*:\s*string/],hint:'选填字段用哪个符号？',
sol:"type Card = { title: string; subtitle?: string }\nconst c: Card = { title: 'BIFM', subtitle: 'agent booking' }",exp:'? 让 subtitle 成为选填——传了要是 string，不传也合法。'},
{d:3,id:'e32',title:'补齐必填字段',brief:'User 的契约要求两个字段。修好对象。',
code:"type User = { id: string; name: string }\nconst u: User = { id: '1' }",
req:[/name\s*:\s*'/],hint:'契约里 name 没有 ?，就是必填。',
sol:"type User = { id: string; name: string }\nconst u: User = { id: '1', name: 'Kami' }",exp:'必填字段缺失 = 违约。编译器替未来的使用者把关。'},
{d:4,id:'e41',title:'收窄 Status',brief:'把 Status 从 string 收窄为四个状态，并修好赋值。',
code:"// 把 Status 收窄为 'idle' | 'loading' | 'error' | 'success'\ntype Status = string\nconst s: Status = 'downloading'",
req:[/type Status = 'idle'\s*\|\s*'loading'\s*\|\s*'error'\s*\|\s*'success'/,/const s:\s*Status\s*=\s*'(idle|loading|error|success)'/],hint:'string 是无边界的；用 | 列出全部允许值。',
sol:"type Status = 'idle' | 'loading' | 'error' | 'success'\nconst s: Status = 'loading'",exp:'union 是收窄：从"任意字符串"缩到"只有四个"。状态机从此不可能出现第五种状态。'},
{d:4,id:'e42',title:'variant 传错值',brief:'Size 只有三档。修好调用。',
code:"type Size = 'sm' | 'md' | 'lg'\nfunction setSize(s: Size) {}\nsetSize('xl')",
req:[/setSize\('(sm|md|lg)'\)/],hint:'xl 不在契约里。',
sol:"type Size = 'sm' | 'md' | 'lg'\nfunction setSize(s: Size) {}\nsetSize('md')",exp:'设计系统的 variants 写进类型后，传错值在编译期就被拦下。'},
{d:5,id:'e51',title:'诚实的返回类型',brief:'空数组时函数实际返回 undefined。让返回类型说真话。',
code:"type Msg = { text: string }\nfunction last(list: Msg[]): Msg {\n  if (list.length === 0) return undefined\n  return list[list.length - 1]\n}",
req:[/:\s*Msg\s*\|\s*undefined/],hint:'基准 Q2 的现场版。返回类型少了谁？',
sol:"type Msg = { text: string }\nfunction last(list: Msg[]): Msg | undefined {\n  if (list.length === 0) return undefined\n  return list[list.length - 1]\n}",exp:'类型诚实后，调用方会被迫先判空——错误在编译期被拦截。'},
{d:5,id:'e52',title:'标注返回类型',brief:'给函数补上返回类型标注。',
code:"function greet(name: string) {\n  return 'hi ' + name\n}",
req:[/greet\(name: string\)\s*:\s*string/],hint:'返回的是拼接后的字符串。',
sol:"function greet(name: string): string {\n  return 'hi ' + name\n}",exp:'对外 API 的返回类型值得手写——它是给调用方看的契约。'},
{d:6,id:'e61',title:'判空收窄',brief:'m 可能是 undefined，直接访问会崩。加收窄让编译器放行。',
code:"type Msg = { text: string }\nfunction len(m: Msg | undefined) {\n  return m.text.length\n}",
req:[/if\s*\(|m\?\./],hint:'先排除 undefined 的可能，TS 会顺着控制流放行。',
sol:"type Msg = { text: string }\nfunction len(m: Msg | undefined) {\n  if (m === undefined) return 0\n  return m.text.length\n}",exp:'if 判空后，后续代码里 m 被收窄为 Msg——报错自然消失。'},
{d:6,id:'e62',title:'typeof 分流',brief:'v 可能是字符串或数字，toFixed 只有数字有。用 typeof 分流。',
code:"function fmt(v: string | number) {\n  return v.toFixed(2)\n}",
req:[/typeof v === 'number'/],hint:"if (typeof v === 'number') { ... } 之后分别处理。",
sol:"function fmt(v: string | number) {\n  if (typeof v === 'number') return v.toFixed(2)\n  return v\n}",exp:'typeof 收窄：分支内 v 是 number，分支外自动只剩 string。'},
{d:9,id:'e91',title:'填对类型参数',brief:'数组装的是数字。修正泛型参数。',
code:"const nums: Array<string> = [1, 2, 3]",
req:[/Array<number>/],hint:'尖括号里填"装什么"。',
sol:"const nums: Array<number> = [1, 2, 3]",exp:'Array<T> 的 T 就是元素类型——泛型是类型层面的插槽。'},
{d:9,id:'e92',title:'读懂泛型推断',brief:'first 返回数组第一个元素（可能没有）。修好标注。',
code:"function first<T>(arr: T[]): T | undefined {\n  return arr[0]\n}\nconst f: number = first(['a', 'b'])",
req:[/:\s*string\s*\|\s*undefined/],hint:'传入 string[]，T 被推断成什么？返回类型跟着是什么？',
sol:"function first<T>(arr: T[]): T | undefined {\n  return arr[0]\n}\nconst f: string | undefined = first(['a', 'b'])",exp:'T=string → 返回 string | undefined。泛型在调用时才落地。'},
{d:10,id:'e101',title:'Promise 的类型参数',brief:'fetchName 兑现的是字符串。修正标注。',
code:"declare function fetchName(): Promise<string>\nconst p: Promise<number> = fetchName()",
req:[/const p:\s*Promise<string>/],hint:'Promise<T> 读作"最终给你一个 T 的承诺"。',
sol:"declare function fetchName(): Promise<string>\nconst p: Promise<string> = fetchName()",exp:'泛型嵌进容器类型：承诺的内容也在契约里。'},
{d:10,id:'e102',title:'setter 的参数类型',brief:'基准 Q3 现场版：T 已被推断为 number。修好 setter 调用。',
code:"declare function useLocalState<T>(initial: T): [T, (next: T) => void]\nconst [n, setN] = useLocalState(0)\nsetN('ten')",
req:[/setN\(\s*-?\d/],hint:'initial 是 0 → T 是 number → setN 只收 number。',
sol:"declare function useLocalState<T>(initial: T): [T, (next: T) => void]\nconst [n, setN] = useLocalState(0)\nsetN(10)",exp:'这就是 useState 的类型机制——你每天在用，现在你能读懂它了。'},
{d:11,id:'e111',title:'删掉错误标注，交给推断',brief:'标注既错误又多余。删掉它，让 TS 自己推断。',
code:"const name: number = 'Kami'",
req:[/const name = 'Kami'/],hint:'能推断就别手写。',
sol:"const name = 'Kami'",exp:'TS 从初始值推断出 string——冗余标注只会制造噪音和出错机会。'},
{d:11,id:'e112',title:'as const 锁定字面量',brief:'加 as const 让 sizes 变成只读字面量元组，再修好赋值。',
code:"const sizes = ['sm', 'md', 'lg']\ntype Size = typeof sizes[number]\nconst s: Size = 'xl'",
req:[/as const/,/const s:\s*Size\s*=\s*'(sm|md|lg)'/],hint:'as const 之前 Size 只是 string；之后才是三个字面量的联合。',
sol:"const sizes = ['sm', 'md', 'lg'] as const\ntype Size = typeof sizes[number]\nconst s: Size = 'md'",exp:'as const + typeof [number]：从数据直接派生类型——设计 token 表的标准玩法。'},
{d:12,id:'e121',title:'用 Omit 派生新类型',brief:'新建消息时还没有 id。用 Omit 定义 NewMessage。',
code:"type Message = { id: string; text: string }\ntype NewMessage = Message\nconst m: NewMessage = { text: 'hi' }",
req:[/Omit<Message,\s*'id'>/],hint:'Omit = 排除某些字段。',
sol:"type Message = { id: string; text: string }\ntype NewMessage = Omit<Message, 'id'>\nconst m: NewMessage = { text: 'hi' }",exp:'从主类型派生而不是复制粘贴——改 Message 时 NewMessage 自动跟上。'},
{d:12,id:'e122',title:'用 Partial 表达补丁',brief:'update 只想传一部分设置。修改参数类型。',
code:"type Settings = { theme: string; lang: string }\nfunction update(patch: Settings) {}\nupdate({ theme: 'dark' })",
req:[/Partial<Settings>/],hint:'Partial = 全部字段变可选。',
sol:"type Settings = { theme: string; lang: string }\nfunction update(patch: Partial<Settings>) {}\nupdate({ theme: 'dark' })",exp:'PATCH 语义的标准表达：每个字段都可传可不传。'},
{d:15,id:'e151',title:'Props 契约',brief:'Card 的 Props 要求两个字段。修好调用。',
code:"type Props = { title: string; count: number }\nfunction Card(props: Props) {\n  return props.title\n}\nCard({ title: 'hello' })",
req:[/count\s*:\s*-?\d/],hint:'Props 类型 = 组件的 API：count 是必填的。',
sol:"type Props = { title: string; count: number }\nfunction Card(props: Props) {\n  return props.title\n}\nCard({ title: 'hello', count: 3 })",exp:'调用组件 = 履行 Props 契约。漏传必填项，编译器直接拦。'},
{d:15,id:'e152',title:'回调 Prop 的签名',brief:'onSelect 的参数是 string 类型的 id。修好实现。',
code:"type Props = { onSelect: (id: string) => void }\ndeclare function List(p: Props): void\nList({ onSelect: (id: number) => {} })",
req:[/id\s*:\s*string/],hint:'回调的参数类型要与契约一致。',
sol:"type Props = { onSelect: (id: string) => void }\ndeclare function List(p: Props): void\nList({ onSelect: (id: string) => {} })",exp:'事件回调的形状也是 Props 契约的一部分——这就是 onClick 类型检查的原理。'},
{d:16,id:'e161',title:'用 & 合并类型',brief:'把原生属性和自定义 variants 合并成 ButtonProps。',
code:"type Native = { disabled?: boolean; onClick?: () => void }\ntype Extra = { variant?: 'primary' | 'ghost' }\ntype ButtonProps = Native\nconst b: ButtonProps = { disabled: true, variant: 'ghost' }",
req:[/Native\s*&\s*Extra|Extra\s*&\s*Native/],hint:'& 是交叉：同时满足两边。',
sol:"type Native = { disabled?: boolean; onClick?: () => void }\ntype Extra = { variant?: 'primary' | 'ghost' }\ntype ButtonProps = Native & Extra\nconst b: ButtonProps = { disabled: true, variant: 'ghost' }",exp:'ComponentProps<\'button\'> & {...} 的微缩模型——基准 Q4 的核心机制。'},
{d:16,id:'e162',title:'别弄丢原生能力',brief:'使用者想传 disabled，但类型里没有。扩展类型（不许删调用处的属性）。',
code:"type ButtonProps = { variant: 'primary' | 'ghost' }\nconst props: ButtonProps = { variant: 'primary', disabled: true }",
req:[/disabled\?\s*:\s*boolean/],hint:'在 ButtonProps 里补上可选的 disabled。',
sol:"type ButtonProps = { variant: 'primary' | 'ghost'; disabled?: boolean }\nconst props: ButtonProps = { variant: 'primary', disabled: true }",exp:'自定义组件丢掉原生属性 = 可访问性静默崩塌。真实项目里用 ComponentProps 一次继承全部。'},
{d:17,id:'e171',title:'用 Record 锁住 variant 表',brief:'styles 的键必须与 Variant 一一对应。加类型，并删掉不该存在的项。',
code:"type Variant = 'primary' | 'ghost'\nconst styles = {\n  primary: 'bg-blue',\n  ghost: 'bg-transparent',\n  fancy: 'bg-pink',\n}",
req:[/Record<Variant,\s*string>/],ban:[/fancy/],hint:'Record<Variant, string> 会同时抓"多了的键"和"漏了的键"。',
sol:"type Variant = 'primary' | 'ghost'\nconst styles: Record<Variant, string> = {\n  primary: 'bg-blue',\n  ghost: 'bg-transparent',\n}",exp:'这就是 cva 的类型学原理：variant 表与类型一一对应，加减 variant 都逃不过编译器。'},
{d:17,id:'e172',title:'让 variant 可选',brief:'Button 应该允许不传 size（走默认值）。修改类型。',
code:"type Props = { size: 'sm' | 'md' | 'lg' }\ndeclare function Button(p: Props): void\nButton({})",
req:[/size\?\s*:/],hint:'有默认值的 variant 应该是选填。',
sol:"type Props = { size?: 'sm' | 'md' | 'lg' }\ndeclare function Button(p: Props): void\nButton({})",exp:'? 表达"有默认值"：API 更友好，契约依然严格。'},
/* ---- Total TypeScript 官方题（Matt Pocock · GPL-3.0）已适配为浏览器内检查 ---- */
{d:2,src:'tt',id:'t01',title:'TT-01 给参数标注类型',brief:'参数隐式 any 触发了报错。给 a、b 标注类型。',
code:"export const addTwoNumbers = (a, b) => {\n  return a + b;\n};\n\nit(\"Should add the two numbers together\", () => {\n  expect(addTwoNumbers(2, 4)).toEqual(6);\n  expect(addTwoNumbers(10, 10)).toEqual(20);\n});",
req:[/a\s*:\s*number/,/b\s*:\s*number/],hint:'测试里传的是数字。',
sol:"export const addTwoNumbers = (a: number, b: number) => {\n  return a + b;\n};\n\nit(\"Should add the two numbers together\", () => {\n  expect(addTwoNumbers(2, 4)).toEqual(6);\n  expect(addTwoNumbers(10, 10)).toEqual(20);\n});",exp:'noImplicitAny：不标注的参数是隐式 any，严格模式直接报错。'},
{d:3,src:'tt',id:'t02',title:'TT-02 对象参数的类型',brief:'params 是隐式 any。给它一个对象类型。',
code:"export const addTwoNumbers = (params) => {\n  return params.first + params.second;\n};\n\nit(\"Should add the two numbers together\", () => {\n  expect(addTwoNumbers({ first: 2, second: 4 })).toEqual(6);\n  expect(addTwoNumbers({ first: 10, second: 20 })).toEqual(30);\n});",
req:[/first\s*:\s*number/,/second\s*:\s*number/],hint:'params: { first: ...; second: ... }，也可以抽成 type。',
sol:"export const addTwoNumbers = (params: { first: number; second: number }) => {\n  return params.first + params.second;\n};\n\nit(\"Should add the two numbers together\", () => {\n  expect(addTwoNumbers({ first: 2, second: 4 })).toEqual(6);\n  expect(addTwoNumbers({ first: 10, second: 20 })).toEqual(30);\n});",exp:'对象参数的形状就是它的契约。抽成 type 别名在真实项目里更常见。'},
{d:3,src:'tt',id:'t03',title:'TT-03 可选属性',brief:'第一个测试只传了 first。让 last 成为可选。',
code:"export const getName = (params: { first: string; last: string }) => {\n  if (params.last) {\n    return `${params.first} ${params.last}`;\n  }\n  return params.first;\n};\n\nit(\"Should work with just the first name\", () => {\n  expect(getName({ first: \"Matt\" })).toEqual(\"Matt\");\n});\n\nit(\"Should work with the first and last name\", () => {\n  expect(getName({ first: \"Matt\", last: \"Pocock\" })).toEqual(\"Matt Pocock\");\n});",
req:[/last\?\s*:\s*string/],hint:'函数体里已经在 if (params.last) 判空了——类型也该如实表达。',
sol:"export const getName = (params: { first: string; last?: string }) => {\n  if (params.last) {\n    return `${params.first} ${params.last}`;\n  }\n  return params.first;\n};\n\nit(\"Should work with just the first name\", () => {\n  expect(getName({ first: \"Matt\" })).toEqual(\"Matt\");\n});\n\nit(\"Should work with the first and last name\", () => {\n  expect(getName({ first: \"Matt\", last: \"Pocock\" })).toEqual(\"Matt Pocock\");\n});",exp:'实现已经把 last 当可选处理了，类型却写成必填——契约与实现不一致就是 bug 的温床。'},
{d:5,src:'tt',id:'t04',title:'TT-04 可选参数',brief:'和上题同理，但这次是位置参数。让 last 可选。',
code:"export const getName = (first: string, last: string) => {\n  if (last) {\n    return `${first} ${last}`;\n  }\n  return first;\n};\n\nit(\"Should work with just the first name\", () => {\n  expect(getName(\"Matt\")).toEqual(\"Matt\");\n});\n\nit(\"Should work with the first and last name\", () => {\n  expect(getName(\"Matt\", \"Pocock\")).toEqual(\"Matt Pocock\");\n});",
req:[/last\?\s*:\s*string/],hint:'位置参数也能用 ?。',
sol:"export const getName = (first: string, last?: string) => {\n  if (last) {\n    return `${first} ${last}`;\n  }\n  return first;\n};\n\nit(\"Should work with just the first name\", () => {\n  expect(getName(\"Matt\")).toEqual(\"Matt\");\n});\n\nit(\"Should work with the first and last name\", () => {\n  expect(getName(\"Matt\", \"Pocock\"))\n    .toEqual(\"Matt Pocock\");\n});",exp:'可选参数必须放在必选参数之后——顺序也是契约的一部分。'},
{d:2,src:'tt',id:'t05',title:'TT-05 给变量标注类型',brief:'如何让 defaultUser 在声明那一行就被约束为 User？补上标注并填齐字段。',
code:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  isAdmin: boolean;\n}\n\nconst defaultUser = {};\n\nconst getUserId = (user: User) => {\n  return user.id;\n};\n\nit(\"Should get the user id\", () => {\n  expect(getUserId(defaultUser)).toEqual(1);\n});",
req:[/defaultUser\s*:\s*User/],hint:'const defaultUser: User = { ... } —— 标注后编译器会告诉你缺哪些字段。',
sol:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  isAdmin: boolean;\n}\n\nconst defaultUser: User = {\n  id: 1,\n  firstName: \"Matt\",\n  lastName: \"Pocock\",\n  isAdmin: true,\n};\n\nconst getUserId = (user: User) => {\n  return user.id;\n};\n\nit(\"Should get the user id\", () => {\n  expect(getUserId(defaultUser)).toEqual(1);\n});",exp:'在声明处标注，错误就近暴露；不标注则错误漂移到远处的使用点，难排查。'},
{d:4,src:'tt',id:'t06',title:'TT-06 用 union 锁定 role',brief:'把 role 收窄为三个允许值（@ts-expect-error 那行会替你验证）。',
code:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  /**\n   * role 只允许 'admin' | 'user' | 'super-admin'\n   */\n  role: string;\n}\n\nexport const defaultUser: User = {\n  id: 1,\n  firstName: \"Matt\",\n  lastName: \"Pocock\",\n  // @ts-expect-error\n  role: \"I_SHOULD_NOT_BE_ALLOWED\",\n};",
req:[/["']admin["']\s*\|\s*["']user["']\s*\|\s*["']super-admin["']/],hint:'role 还是 string 时，@ts-expect-error 会因为"底下没有错误"而自己报错。',
sol:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  role: \"admin\" | \"user\" | \"super-admin\";\n}\n\nexport const defaultUser: User = {\n  id: 1,\n  firstName: \"Matt\",\n  lastName: \"Pocock\",\n  // @ts-expect-error\n  role: \"I_SHOULD_NOT_BE_ALLOWED\",\n};",exp:'@ts-expect-error 是"此处应当报错"的断言——union 收窄成功后它才成立。'},
{d:2,src:'tt',id:'t07',title:'TT-07 数组类型',brief:'posts 是多篇文章。修正它的类型。',
code:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  role: \"admin\" | \"user\" | \"super-admin\";\n  posts: Post;\n}\n\ninterface Post {\n  id: number;\n  title: string;\n}\n\nexport const defaultUser: User = {\n  id: 1,\n  firstName: \"Matt\",\n  lastName: \"Pocock\",\n  role: \"admin\",\n  posts: [\n    { id: 1, title: \"How I eat so much cheese\" },\n    { id: 2, title: \"Why I don't eat more vegetables\" },\n  ],\n};",
req:[/Post\[\]|Array<Post>/],hint:'Post[] 或 Array<Post> 都行。',
sol:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  role: \"admin\" | \"user\" | \"super-admin\";\n  posts: Post[];\n}\n\ninterface Post {\n  id: number;\n  title: string;\n}\n\nexport const defaultUser: User = {\n  id: 1,\n  firstName: \"Matt\",\n  lastName: \"Pocock\",\n  role: \"admin\",\n  posts: [\n    { id: 1, title: \"How I eat so much cheese\" },\n    { id: 2, title: \"Why I don't eat more vegetables\" },\n  ],\n};",exp:'两种数组写法完全等价；团队里统一一种即可。'},
{d:5,src:'tt',id:'t08',title:'TT-08 返回类型标注',brief:'如何保证 makeUser 永远返回一个合法的 User？标注返回类型并补全对象。',
code:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  role: \"admin\" | \"user\" | \"super-admin\";\n  posts: Array<Post>;\n}\n\ninterface Post {\n  id: number;\n  title: string;\n}\n\nconst makeUser = () => {\n  return {};\n};\n\nit(\"Should return a valid user\", () => {\n  const user = makeUser();\n  expect(user.id).toBeTypeOf(\"number\");\n});",
req:[/\)\s*:\s*User\s*=>/],hint:'const makeUser = (): User => { ... }，然后按编译器提示补齐字段。',
sol:"interface User {\n  id: number;\n  firstName: string;\n  lastName: string;\n  role: \"admin\" | \"user\" | \"super-admin\";\n  posts: Array<Post>;\n}\n\ninterface Post {\n  id: number;\n  title: string;\n}\n\nconst makeUser = (): User => {\n  return {\n    id: 1,\n    firstName: \"Matt\",\n    lastName: \"Pocock\",\n    role: \"admin\",\n    posts: [{ id: 1, title: \"My first post\" }],\n  };\n};\n\nit(\"Should return a valid user\", () => {\n  const user = makeUser();\n  expect(user.id).toBeTypeOf(\"number\");\n});",exp:'返回类型标注 = 对所有调用方的承诺，编译器负责监督你兑现。'},

/* 精简版 lib.d.ts —— 覆盖全部练习所需 */
const LIB=`interface Object {}
interface Function {}
interface CallableFunction {}
interface NewableFunction {}
interface IArguments {}
interface Boolean {}
interface Symbol {}
interface RegExp {}
interface Number { toFixed(digits?: number): string }
interface String { length: number; toUpperCase(): string }
interface Array<T> { length: number; [n: number]: T; push(...items: T[]): number; pop(): T | undefined; map<U>(fn: (v: T, i: number) => U): U[]; filter(fn: (v: T) => unknown): T[]; find(fn: (v: T) => unknown): T | undefined }
interface ReadonlyArray<T> { readonly length: number; readonly [n: number]: T }
interface ArrayConstructor { from<T>(iterable: Set<T>): T[]; isArray(arg: any): arg is any[] }
declare var Array: ArrayConstructor
interface Error { name: string; message: string; stack?: string }
declare var Error: { new (message?: string): Error; (message?: string): Error }
interface Set<T> { add(value: T): this; has(value: T): boolean; delete(value: T): boolean; readonly size: number }
declare var Set: { new <T = unknown>(values?: ReadonlyArray<T>): Set<T> }
interface PromiseLike<T> { then<T1 = T, T2 = never>(onfulfilled?: ((value: T) => T1 | PromiseLike<T1>) | null, onrejected?: ((reason: any) => T2 | PromiseLike<T2>) | null): PromiseLike<T1 | T2> }
interface Promise<T> { then<T1 = T, T2 = never>(onfulfilled?: ((value: T) => T1 | PromiseLike<T1>) | null, onrejected?: ((reason: any) => T2 | PromiseLike<T2>) | null): Promise<T1 | T2>; catch<T2 = never>(onrejected?: ((reason: any) => T2 | PromiseLike<T2>) | null): Promise<T | T2> }
declare var Promise: { new <T>(executor: (resolve: (value: T | PromiseLike<T>) => void, reject: (reason?: any) => void) => void): Promise<T>; resolve<T>(value: T): Promise<T> }
type PromiseConstructorLike = new <T>(executor: (resolve: (value: T | PromiseLike<T>) => void, reject: (reason?: any) => void) => void) => PromiseLike<T>
declare function fetch(url: string): Promise<{ json(): Promise<any> }>
declare var window: { addEventListener(type: string, listener: () => void): void }
declare function it(name: string, fn: () => any): void
declare const expect: any
interface TemplateStringsArray extends ReadonlyArray<string> {}
type Partial<T> = { [P in keyof T]?: T[P] }
type Required<T> = { [P in keyof T]-?: T[P] }
type Readonly<T> = { readonly [P in keyof T]: T[P] }
type Pick<T, K extends keyof T> = { [P in K]: T[P] }
type Record<K extends keyof any, T> = { [P in K]: T }
type Exclude<T, U> = T extends U ? never : T
type Omit<T, K extends keyof any> = Pick<T, Exclude<keyof T, K>>
type Expect<T extends true> = T
type Equal<X, Y> = (<T>() => T extends X ? 1 : 2) extends (<T>() => T extends Y ? 1 : 2) ? true : false
type NotEqual<X, Y> = true extends Equal<X, Y> ? false : true
declare var console: { log(...args: unknown[]): void }`;

let TSC=null, tsLoading=null;
function loadTS(){
  if(TSC) return Promise.resolve(true);
  if(window.ts){ TSC=window.ts; return Promise.resolve(true); }
  if(!tsLoading){
    tsLoading=new Promise(res=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/typescript/5.4.5/typescript.min.js';
      s.onload=()=>{ TSC=window.ts||null; res(!!TSC); };
      s.onerror=()=>res(false);
      document.head.appendChild(s);
    });
  }
  return tsLoading;
}
function typeCheck(code){
  const ts=TSC;
  const files={'main.ts':code,'lib.d.ts':LIB};
  const host={
    getScriptFileNames:()=>['main.ts'],
    getScriptVersion:()=>'1',
    getScriptSnapshot:f=>files[f]!==undefined?ts.ScriptSnapshot.fromString(files[f]):undefined,
    getCurrentDirectory:()=>'',
    getCompilationSettings:()=>({strict:true,noEmit:true,skipLibCheck:true,target:ts.ScriptTarget.ES5}),
    getDefaultLibFileName:()=>'lib.d.ts',
    fileExists:f=>files[f]!==undefined,
    readFile:f=>files[f]
  };
  const svc=ts.createLanguageService(host,ts.createDocumentRegistry());
  const diags=svc.getSyntacticDiagnostics('main.ts').concat(svc.getSemanticDiagnostics('main.ts'));
  return diags.map(dg=>{
    let line=0;
    try{ line=dg.file.getLineAndCharacterOfPosition(dg.start).line+1; }catch(e){}
    return {line,msg:ts.flattenDiagnosticMessageText(dg.messageText,'\n')};
  });
}

/* ============ 存储 ============ */
const KEY='tsquiz:v1';
let DB={days:{},wrong:[],points:{},ex:{}};
/* 双通道存储：Claude 预览环境用 window.storage；本地浏览器打开用 localStorage。
   键名固定为 tsquiz:v1 —— 以后替换 html 文件不影响已有数据 */
async function load(){
  let raw=null;
  try{ const r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ DB=JSON.parse(raw); }catch(e){} }
  DB.days=DB.days||{};
  DB.wrong=DB.wrong||[];
  DB.points=DB.points||{};
  DB.ex=DB.ex||{};
  DB.wrong.forEach(w=>{ if(!w.due) w.due=(w.ts||Date.now())+864e5; });
}
const pointDay=p=>{const q=BANK.find(x=>x.p===p);return q?q.d:'?';};
async function save(){
  const s=JSON.stringify(DB);
  try{ await window.storage.set(KEY,s); }catch(e){}
  try{ localStorage.setItem(KEY,s); }catch(e){}
}
const qid=q=>q.d*100+BANK.filter(x=>x.d===q.d).indexOf(q);
const byId=id=>BANK.filter(x=>x.d===Math.floor(id/100))[id%100];

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(line){ // 极简语法着色
  let s=esc(line);
  s=s.replace(/('[^']*')/g,'<span class="ts">$1</span>');
  s=s.replace(/\b(type|function|return|if|const|let|=&gt;)\b/g,'<span class="tk">$1</span>');
  s=s.replace(/(\/\/.*)$/,'<span class="tc">$1</span>');
  return s;
}
function codeBlock(lines){
  return '<div class="code">'+lines.map((l,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="c">${hl(l)}</span></div>`).join('')+'</div>';
}
function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,'').replace(/[""'']/g,"'"); }

/* ============ Home ============ */
function renderHome(){
  const weeks=[[1,7,'Week 1 · 类型是契约'],[8,14,'Week 2 · 泛型与报错'],[15,21,'Week 3 · React × 设计系统']];
  let html='<div class="union"><div class="decl"><span class="kw">type</span> Day = <span style="color:var(--dim)">// 点击进入当日测试（每天 4 题）</span></div>';
  for(const [s,e,label] of weeks){
    html+=`<div class="weekband">${label}</div><div class="days">`;
    for(let d=s;d<=e;d++){
      const rec=DB.days[d];
      const cls=rec?(rec.s===rec.t?'day done perfect':'day done hasWrong'):'day';
      const sc=rec?`${rec.s}/${rec.t}`:'·';
      html+=`<button class="${cls}" data-day="${d}" title="Day ${d} · ${TOPICS[d]}"><span class="n">${d}</span>${d<e?'<span class="pipe"> |</span>':''}<span class="sc">${sc}</span></button>`;
    }
    html+='</div>';
  }
  html+='</div>';
  const now=Date.now();
  const due=DB.wrong.filter(w=>(w.due||0)<=now).length;
  if(due) html+=`<div class="alertbox due">↻ <b>${due}</b> 道错题已到复现时间 — 会自动混入你开始的下一次日测</div>`;
  const hot=Object.entries(DB.points).filter(([,n])=>n>=2);
  if(hot.length) html+=`<div class="alertbox hot"><b>⚠ 知识点预警</b> · 累计错 ≥2 次，刷题无效，建议回源头重学：<br>${hot.map(([p,n])=>`<span class="hotp"># ${p} ×${n} → 回 Day ${pointDay(p)}</span>`).join('')}</div>`;
  html+=`<div class="toolbar">
    <button class="btn warn" id="gowrong">错题集（${DB.wrong.length}）</button>
    ${DB.wrong.length?'<button class="btn" id="goretry">重练错题</button>':''}
    <button class="btn" id="bkexp">备份进度</button>
    <button class="btn" id="bkimp">恢复备份</button>
  </div>
  <p class="subnote"><b>每日四步</b>：① 读阮一峰对应章节（wangdoc.com/typescript）→ ② Playground 手抄+故意改错 → ③ <b>修题练习（已内置本站）</b> → ④ 当日测验。点某一天进入当日中心即可完成 ③④。学习日每天 8 题，另混入 <b>2 道往日温故抽查</b>（♻）对抗遗忘；答错自动进错题集，<b>1 天后自动混入日测</b>（↻），练对即移出。Day 7 / 14 / 21 是验收日。</p>`;
  $('#app').innerHTML=html;
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{view={name:'hub',day:+b.dataset.day};render();});
  $('#gowrong').onclick=()=>{view={name:'wrong'};render();};
  const r=$('#goretry'); if(r) r.onclick=startRetry;
  $('#bkexp').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ts-quiz-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('#bkimp').onclick=()=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=async()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      try{
        const d=JSON.parse(await f.text());
        if(!d||typeof d!=='object'||!d.days) throw new Error('不是有效的备份文件');
        DB=d; DB.days=DB.days||{}; DB.wrong=DB.wrong||[]; DB.points=DB.points||{}; DB.ex=DB.ex||{};
        await save(); render();
      }catch(e){ alert('恢复失败：'+e.message); }
    };
    inp.click();
  };
  topstat();
}

/* ============ Quiz ============ */
function startDay(d){
  const core=BANK.filter(q=>q.d===d);
  const coreIds=new Set(core.map(qid));
  const now=Date.now();
  const review=DB.wrong.filter(w=>(w.due||0)<=now&&!coreIds.has(w.id)).map(w=>byId(w.id)).filter(Boolean);
  const revIds=new Set(review.map(qid));
  // 温故抽查：从已学过的往日随机抽 2 题（含答对过的），对抗遗忘
  const pool=BANK.filter(q=>q.d<d&&!revIds.has(qid(q)));
  const recap=[];
  while(recap.length<2&&pool.length){ recap.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  session={qs:core.concat(review).concat(recap),idx:0,answers:[],mode:'day',day:d,reviewIds:revIds,recapIds:new Set(recap.map(qid))};
  view={name:'quiz'}; render();
}
function startRetry(){
  const qs=DB.wrong.map(w=>byId(w.id)).filter(Boolean);
  if(!qs.length) return;
  session={qs,idx:0,answers:[],mode:'retry'};
  view={name:'quiz'}; render();
}

function renderQuiz(){
  const {qs,idx,mode}=session;
  if(idx>=qs.length) return renderResult();
  const q=qs[idx];
  const fname=mode==='retry'?'retry.ts':`day-${String(q.d).padStart(2,'0')}.ts`;
  const isRev=session.reviewIds&&session.reviewIds.has(qid(q));
  const isRecap=session.recapIds&&session.recapIds.has(qid(q));
  const tag=`<span class="ptag"># ${q.p}</span>`
    +(isRev?`<span class="ptag rev">↻ 错题复现 · Day ${q.d}</span>`:'')
    +(isRecap?`<span class="ptag" style="color:var(--warn);border-color:color-mix(in srgb, var(--warn) 35%, transparent);margin-left:6px">♻ 温故抽查 · Day ${q.d}</span>`:'');
  let body=tag+`<div class="qtext">${q.q}</div>`;
  if(q.c) body=tag+codeBlock(q.c)+`<div class="qtext">${q.q}</div>`;

  if(q.t==='fill'){
    body+=`<div class="fillrow"><input class="fill" id="fillin" placeholder="输入答案…" autocomplete="off" spellcheck="false"><button class="btn primary" id="submit">检查</button></div>`;
  }else{
    const opts=q.t==='tf'?['对','错']:q.o;
    body+='<div class="opts">'+opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')+'</div>';
  }
  body+='<div id="fb"></div><div class="navrow"><span class="hint">'+(mode==='retry'?'错题重练 · 答对将移出错题集':`Day ${q.d} · ${TOPICS[q.d]}`)+`</span><span class="hint">${idx+1} / ${qs.length}</span></div>`;

  $('#app').innerHTML=`<div class="backrow"><button class="crumb" id="back">← 退出本轮</button></div>
    <div class="qcard"><div class="qhead"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span><span class="fname">${fname}</span><span class="prog">tsc --watch</span></div>
    <div class="qbody">${body}</div></div>`;
  $('#back').onclick=()=>{view={name:'home'};render();};

  if(q.t==='fill'){
    const go=()=>answer(norm($('#fillin').value)?$('#fillin').value:null);
    $('#submit').onclick=go;
    $('#fillin').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    $('#fillin').focus();
  }else{
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  }
}

async function answer(ua){
  if(ua===null) return;
  const {qs,idx}=session; const q=qs[idx];
  let ok, uaDisplay, caDisplay;
  if(q.t==='fill'){
    ok=q.a.some(a=>norm(a)===norm(ua));
    uaDisplay=ua; caDisplay=q.a[0];
  }else{
    const opts=q.t==='tf'?['对','错']:q.o;
    ok=ua===q.a; uaDisplay=opts[ua]; caDisplay=opts[q.a];
    document.querySelectorAll('.opt').forEach((b,i)=>{
      b.classList.add('lock'); b.disabled=true;
      if(i===q.a)b.classList.add('right');
      if(i===ua&&!ok)b.classList.add('wrongpick');
    });
  }
  const id=qid(q);
  const isRev=session.reviewIds&&session.reviewIds.has(id);
  const isRecap=session.recapIds&&session.recapIds.has(id);
  const excluded=isRev||isRecap||session.mode==='retry';
  session.answers.push({q,ok,ua:uaDisplay,review:excluded});
  if(ok){
    if(isRev||session.mode==='retry'){ DB.wrong=DB.wrong.filter(w=>w.id!==id); await save(); }
  }else{
    const due=Date.now()+864e5;
    const ex=DB.wrong.find(w=>w.id===id);
    if(ex){ ex.ua=String(uaDisplay); ex.ts=Date.now(); ex.due=due; }
    else DB.wrong.push({id,ua:String(uaDisplay),ts:Date.now(),due});
    DB.points[q.p]=(DB.points[q.p]||0)+1;
    await save();
  }
  const fb=$('#fb');
  fb.innerHTML=ok
    ?`<div class="tsc ok">✓ compiled successfully — 0 errors<div class="exp">${q.e}</div></div>`
    :`<div class="tsc bad"><span class="ehead">error TS0001: 答案不匹配</span><br><span class="hint">期望：</span><span class="ans">${esc(caDisplay)}</span> <span class="hint">· 实际：</span>${esc(String(uaDisplay))}<div class="exp"><b style="color:var(--warn)"># ${q.p}</b> — ${q.e}</div></div>`;
  fb.innerHTML+=`<div class="navrow"><span></span><button class="btn primary" id="next">${idx+1>=qs.length?'查看结果':'下一题 →'}</button></div>`;
  if(q.t==='fill'){ $('#fillin').disabled=true; $('#submit').disabled=true; }
  $('#next').onclick=()=>{session.idx++;renderQuiz();};
  $('#next').focus();
}

async function renderResult(){
  const {qs,answers,mode,day}=session;
  const core=answers.filter(a=>!a.review), rev=answers.filter(a=>a.review);
  const score=core.length?core.filter(a=>a.ok).length:answers.filter(a=>a.ok).length;
  const total=core.length||qs.length;
  if(mode==='day'&&core.length){ DB.days[day]={s:score,t:core.length,ts:Date.now()}; await save(); }
  const wrongN=answers.filter(a=>!a.ok).length;
  const perfect=wrongN===0;
  const verdict=perfect
    ?'✓ 0 errors · 全部通过'
    :`⚠ ${wrongN} 处未通过 · 已录入错题集，1 天后自动混入日测`;
  const revLine=rev.length?`<div class="hint" style="margin-bottom:14px">↻♻ 复现/温故：${rev.filter(a=>a.ok).length}/${rev.length} 答对</div>`:'';
  let list='';
  answers.filter(a=>!a.ok).forEach(a=>{
    list+=`<div class="witem" style="text-align:left"><div class="wq">${a.q.q}</div><div class="meta"><span class="lbl">知识点：</span><span style="color:var(--warn)">${a.q.p}</span></div><div class="we">${a.q.e}</div></div>`;
  });
  $('#app').innerHTML=`<div class="result">
      <div class="big">${score}<span class="sep"> / </span>${total}</div>
      <div class="verdict ${perfect?'ok':'bad'}">${verdict}</div>${revLine}
      <div class="toolbar" style="justify-content:center">
        <button class="btn primary" id="home">返回日历</button>
        ${!perfect&&mode==='day'?`<button class="btn" id="redo">重做本日</button>`:''}
        ${DB.wrong.length?`<button class="btn warn" id="gw">错题集（${DB.wrong.length}）</button>`:''}
      </div></div>${list}`;
  $('#home').onclick=()=>{view={name:'home'};render();};
  const rd=$('#redo'); if(rd) rd.onclick=()=>startDay(day);
  const gw=$('#gw'); if(gw) gw.onclick=()=>{view={name:'wrong'};render();};
  topstat();
}

/* ============ 当日中心 Hub ============ */
function renderHub(){
  const d=view.day;
  const exs=EX.filter(e=>e.d===d);
  const exDone=exs.filter(e=>DB.ex[e.id]).length;
  const rec=DB.days[d];
  const now=Date.now();
  const due=DB.wrong.filter(w=>(w.due||0)<=now).length;
  $('#app').innerHTML=`<div class="backrow"><button class="crumb" id="back">← 返回日历</button></div>
    <h2 class="vt"><span class="kw">Day</span> ${d} <span class="str">· ${TOPICS[d]}</span></h2>
    <div class="matline">📖 <b>今日主教材：</b>${DAYMAT[d]||''}<br><span class="steps">① 读教材 → ② Playground 手抄+故意改错 → ③ 修题练习 → ④ 当日测验</span></div>
    <div class="hubrow">
      ${exs.length
        ?`<button class="hubcard" id="goex"><span class="hn">③ 修题练习</span><span class="hs ${exDone===exs.length?'ok':''}">${exDone}/${exs.length} ${exDone===exs.length?'✓':''}</span><span class="hd">改代码 → 真实 tsc 检查 → 0 errors 过关</span></button>`
        :`<div class="hubcard mute"><span class="hn">③ 修题练习</span><span class="hs">本日无练习</span><span class="hd">按当日任务执行（复盘 / 攻坚 / 实战）</span></div>`}
      <button class="hubcard" id="goquiz"><span class="hn">④ 当日测验</span><span class="hs ${rec?(rec.s===rec.t?'ok':'warn'):''}">${rec?`${rec.s}/${rec.t}`:'未完成'}</span><span class="hd">${BANK.filter(q=>q.d===d).length} 题${d>1?' + 2 道温故抽查':''}${due?` + ${due} 道到期错题`:''}</span></button>
    </div>`;
  $('#back').onclick=()=>{view={name:'home'};render();};
  const ge=$('#goex'); if(ge) ge.onclick=()=>{view={name:'ex',day:d,i:0};render();};
  $('#goquiz').onclick=()=>startDay(d);
  topstat();
}

/* ============ 修题练习 ============ */
const EDITS={};
function renderEx(){
  const d=view.day, list=EX.filter(e=>e.d===d), i=view.i||0, ex=list[i];
  if(!ex){ view={name:'hub',day:d}; return render(); }
  const done=!!DB.ex[ex.id];
  const cur=EDITS[ex.id]!==undefined?EDITS[ex.id]:ex.code;
  $('#app').innerHTML=`<div class="backrow"><button class="crumb" id="back">← Day ${d} 中心</button></div>
    <div class="qcard"><div class="qhead"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span><span class="fname">day-${String(d).padStart(2,'0')}.ex${i+1}.ts</span><span class="prog">${done?'✓ passed':'tsc --watch'}</span></div>
    <div class="qbody">
      <span class="ptag"># ${ex.title}${done?' ✓':''}</span>${ex.src==='tt'?`<span class="ptag" style="color:var(--accent-strong);border-color:color-mix(in srgb, var(--accent) 35%, transparent);margin-left:6px">Total TypeScript 官方题</span>`:''}
      <div class="qtext">${ex.brief}</div>
      ${ex.src==='tt'?`<div class="hint" style="margin-bottom:10px">题源：Total TypeScript Beginner's Tutorial · Matt Pocock · GPL-3.0（已适配为浏览器内检查）</div>`:''}
      <textarea class="editor" id="ed" spellcheck="false">${esc(cur)}</textarea>
      <div class="toolbar" style="margin:12px 0 0">
        <button class="btn primary" id="check">检查（真实 tsc）</button>
        <button class="btn" id="reset">重置代码</button>
        <button class="btn" id="reveal">看解答</button>
      </div>
      <div id="exout"></div>
      <div class="navrow">
        <button class="btn" id="prev" ${i===0?'disabled':''}>← 上一题</button>
        <span class="hint">${i+1} / ${list.length}</span>
        <button class="btn" id="nx" ${i>=list.length-1?'disabled':''}>下一题 →</button>
      </div>
    </div></div>`;
  const ed=$('#ed');
  const fit=()=>{ ed.style.height='auto'; ed.style.height=Math.min(ed.scrollHeight+6,640)+'px'; };
  fit();
  ed.addEventListener('keydown',e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ed.selectionStart; ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(ed.selectionEnd); ed.selectionStart=ed.selectionEnd=s+2; }});
  ed.addEventListener('input',()=>{ EDITS[ex.id]=ed.value; fit(); });
  $('#back').onclick=()=>{view={name:'hub',day:d};render();};
  $('#prev').onclick=()=>{view.i=i-1;render();};
  $('#nx').onclick=()=>{view.i=i+1;render();};
  $('#reset').onclick=()=>{ delete EDITS[ex.id]; render(); };
  $('#reveal').onclick=()=>{
    $('#exout').innerHTML=`<div class="tsc ok" style="color:var(--text)"><b style="color:var(--warn)">参考解答</b>${codeBlock(ex.sol.split('\n'))}<div class="exp">${ex.exp}<br><span class="hint">建议：看懂后点「重置代码」，凭记忆自己敲一遍再检查。</span></div></div>`;
  };
  $('#check').onclick=async()=>{
    const code=ed.value;
    $('#exout').innerHTML=`<div class="tsc ok" style="color:var(--dim)">// 编译器加载中…</div>`;
    const hasTS=await loadTS();
    let diags=[], compilerNote='';
    if(hasTS){ try{ diags=typeCheck(code); }catch(e){ compilerNote='（编译器异常，降级为模式检查）'; } }
    else compilerNote='（编译器未能加载，降级为模式检查）';
    const reqOk=(ex.req||[]).every(r=>r.test(code));
    const banOk=!(ex.ban||[]).some(r=>r.test(code));
    const pass=diags.length===0&&reqOk&&banOk;
    const okHtml=`<div class="tsc ok">✓ compiled successfully — 0 errors ${compilerNote}<div class="exp">${ex.exp}</div></div>`;
    if(pass){
      if(!DB.ex[ex.id]){ DB.ex[ex.id]=true; await save(); render(); }
      $('#exout').innerHTML=okHtml;
    }else{
      let lines='';
      diags.slice(0,5).forEach(dg=>{ lines+=`<span class="ehead">main.ts:${dg.line}</span> — ${esc(dg.msg)}<br>`; });
      if(!diags.length&&(!reqOk||!banOk)) lines=`<span class="ehead">检查未通过</span> — 编译通过了，但还没满足本题要求。<br>`;
      $('#exout').innerHTML=`<div class="tsc bad">${lines}<div class="exp"><b style="color:var(--warn)">提示</b> — ${ex.hint}</div></div>`;
    }
  };
}

/* ============ 错题集 ============ */
function renderWrong(){
  let html=`<div class="backrow"><button class="crumb" id="back">← 返回日历</button></div>
  <h2 class="vt"><span class="kw">const</span> 错题集 = <span class="str">[${DB.wrong.length}]</span></h2>`;
  if(!DB.wrong.length){
    html+='<div class="empty">// 空空如也 — 保持住 ✓</div>';
  }else{
    html+=`<div class="toolbar"><button class="btn primary" id="retry">重练全部错题（练对自动移出）</button><button class="btn warn" id="clear">清空错题集</button></div>`;
    const groups={};
    DB.wrong.forEach(w=>{const q=byId(w.id); if(!q)return; (groups[q.p]=groups[q.p]||[]).push({w,q});});
    for(const [p,items] of Object.entries(groups)){
      const isHot=(DB.points[p]||0)>=2;
      html+=`<div class="group"><h3 class="${isHot?'hoth':''}"># ${p}（${items.length}）${isHot?` · 累计错 ${DB.points[p]} 次 — 建议回 Day ${pointDay(p)} 重学`:''}</h3>`;
      items.forEach(({w,q})=>{
        const ca=q.t==='fill'?q.a[0]:(q.t==='tf'?['对','错'][q.a]:q.o[q.a]);
        html+=`<div class="witem"><div class="wq">${q.q}</div>
          ${q.c?codeBlock(q.c):''}
          <div class="meta"><span class="lbl">你的答案：</span><span class="ua">${esc(w.ua)}</span><br><span class="lbl">正确答案：</span><span class="ca">${esc(String(ca))}</span> <span class="dtag">· Day ${q.d}</span></div>
          <div class="we">${q.e}</div></div>`;
      });
      html+='</div>';
    }
  }
  $('#app').innerHTML=html;
  $('#back').onclick=()=>{view={name:'home'};render();};
  const r=$('#retry'); if(r) r.onclick=startRetry;
  const c=$('#clear'); if(c) c.onclick=async()=>{ if(confirm('确定清空全部错题和知识点计数？')){ DB.wrong=[]; DB.points={}; await save(); render(); } };
  topstat();
}

/* ============ Router ============ */
function render(){
  if(view.name==='home')renderHome();
  else if(view.name==='hub')renderHub();
  else if(view.name==='ex')renderEx();
  else if(view.name==='quiz')renderQuiz();
  else if(view.name==='wrong')renderWrong();
}
(async()=>{ await load(); render(); })();
</script>
</body>
</html>
